name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-eslint:
    name: SAST ESLint Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with security plugin
        run: npm run sast:eslint
        continue-on-error: true

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-eslint-report-${{ github.run_id }}
          path: |
            eslint-sast.json
            eslint-sast.txt
          retention-days: 30
          if-no-files-found: ignore

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOMs
        run: npm run sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90
          if-no-files-found: ignore

  license-check:
    name: License Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run license check
        run: npm run license:check
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ github.run_id }}
          path: |
            license-report.json
            license-summary.txt
          retention-days: 90
          if-no-files-found: ignore

  k8s-manifest-check:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run K8s manifest check
        run: bash scripts/k8s-manifest-check.sh --output-dir .
        continue-on-error: true

      - name: Upload K8s check report
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifest-check-${{ github.run_id }}
          path: |
            k8s-yaml-check.txt
            k8s-dry-run.txt
          retention-days: 30
          if-no-files-found: ignore
