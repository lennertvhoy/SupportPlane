name: Browser E2E Smoke Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportplane
          POSTGRES_PASSWORD: supportplane_dev
          POSTGRES_DB: supportplane_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://supportplane:supportplane_dev@localhost:5432/supportplane_e2e?schema=public
      E2E_API_PORT: 4111
      E2E_WEB_PORT: 3201
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build all workspaces
        run: npm run build

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U supportplane && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Seed test data
        run: npx tsx prisma/seed.ts

      - name: Start API
        run: |
          PORT=4111 NODE_ENV=test SUPPORTPLANE_AUTH_MODE=local SUPPORTPLANE_STORE=postgres node apps/api/dist/src/main.js &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -sf http://localhost:4111/health && exit 0
            sleep 1
          done
          echo "API did not start"
          exit 1

      - name: Start Web
        run: |
          PORT=3201 node apps/web/node_modules/.bin/next start -p 3201 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -sf http://localhost:3201/ && exit 0
            sleep 1
          done
          echo "Web did not start"
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          E2E_API_PORT: 4111
          E2E_WEB_PORT: 3201

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          kill $API_PID $WEB_PID 2>/dev/null || true
