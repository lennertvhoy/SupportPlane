    truth_summary: >
      SupportPlane is a multi-tenant, self-hostable AI support cockpit where
      tickets, calls, screen context, endpoint diagnostics, and remote support
      activity are unified into governed Support Sessions. AI assistance is
      constrained by RBAC, ABAC, tenant/device policy, approvals, tool manifests,
      execution gateways, and audit-grade evidence.
    primary_users:
      - IT support teams
      - managed service providers
      - support managers
      - auditors/read-only reviewers
    primary_promise: >
      Every IT support interaction gets the right context, the right AI help,
      and the right safety controls.
    non_goals:
      - unrestricted general-purpose AI agent
      - direct model-to-endpoint privileged execution
      - arbitrary shell execution in v1
      - replacing remote desktop tooling in the first version
      - claiming full regulatory compliance in MVP

