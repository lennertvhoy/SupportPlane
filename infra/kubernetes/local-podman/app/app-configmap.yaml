apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: supportplane-app
  labels:
    app.kubernetes.io/part-of: supportplane
    supportplane.io/sandbox: local-podman
data:
  SUPPORTPLANE_STORE: 'postgres'
  SUPPORTPLANE_AUTH_MODE: 'local'
  API_PORT: '4110'
  PORT: '3200'
  SUPPORTPLANE_WORKER_EMAIL: 'admin@supportplane.local'
  # Zammad sandbox connector configuration (BL-107)
  ZAMMAD_CONNECTOR_MODE: 'zammad'
  ZAMMAD_BASE_URL: 'http://zammad.supportplane-integrations.svc.cluster.local:3000'
  # GLPI sandbox connector configuration (BL-069 / Session 140)
  GLPI_BASE_URL: 'http://glpi.supportplane-integrations.svc.cluster.local:80'
  GLPI_API_TOKEN: 'sp-api:supportplane'
  OPENBAO_RESOLVER_ENABLED: 'true'
  OPENBAO_ADDR: 'http://openbao.supportplane-integrations.svc.cluster.local:8200'
  SUPPORTPLANE_QUEUE_BACKEND: 'nats-jetstream'
  NATS_URL: 'nats://nats.supportplane-integrations.svc.cluster.local:4222'
  NATS_OUTBOX_STREAM: 'SUPPORTPLANE_OUTBOX'
  NATS_OUTBOX_SUBJECT: 'supportplane.outbox.ready'
  NATS_OUTBOX_CONSUMER: 'SUPPORTPLANE_WORKER'
  OLLAMA_ENABLED: 'true'
  # Ollama local sandbox: actual host Ollama runs on 0.0.0.0:11434 (v0.22.0, ROCm gfx1101).
  # host.containers.internal does not resolve in this Kind/Podman rootless setup.
  # Pods reach the host via the Podman bridge gateway IP.
  OLLAMA_BASE_URL: 'http://10.88.0.1:11434'
  OLLAMA_MODEL: 'gemma4:e4b'
  OLLAMA_TIMEOUT_MS: '30000'
  OLLAMA_FALLBACK_ENABLED: 'true'
  # Web build-time API base URL for cluster access
  NEXT_PUBLIC_API_BASE_URL: 'http://localhost:4210'
  # BL-111/112/113: Enable sandbox-only writeback, MinIO evidence, Mailpit notification
  SUPPORTPLANE_SANDBOX_WRITEBACK_ENABLED: 'true'
  MINIO_ENDPOINT: 'http://minio.supportplane-data.svc.cluster.local:9000'
  MINIO_ACCESS_KEY: 'minioadmin'
  MINIO_SECRET_KEY: 'minioadmin'
  MINIO_EVIDENCE_BUCKET: 'supportplane-evidence'
  MAILPIT_SMTP: 'mailpit.supportplane-integrations.svc.cluster.local:1025'
  # OIDC local sandbox configuration (BL-083)
  # Both API and browser reach Keycloak via the host's Podman bridge IP (port-forward binds 0.0.0.0).
  OIDC_ISSUER_URL: 'http://10.88.0.1:8080/realms/supportplane-local'
  OIDC_BROWSER_BASE_URL: 'http://10.88.0.1:8080/realms/supportplane-local'
  OIDC_CLIENT_ID: 'supportplane-web'
  OIDC_REDIRECT_URI: 'http://localhost:4210/auth/oidc/callback'
  OIDC_SCOPES: 'openid,profile,email'
