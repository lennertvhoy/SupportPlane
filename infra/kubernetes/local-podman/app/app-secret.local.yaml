apiVersion: v1
kind: Secret
metadata:
  name: app-secret-local
  namespace: supportplane-app
  labels:
    app.kubernetes.io/part-of: supportplane
    supportplane.io/sandbox: local-podman
    supportplane.io/non-production: "true"
    supportplane.io/secret-type: local-dev-placeholder
type: Opaque
stringData:
  DATABASE_URL: "postgresql://supportplane:supportplane_dev@postgres.supportplane-data.svc.cluster.local:5432/supportplane"
  SUPPORTPLANE_WORKER_PASSWORD: "supportplane-demo"
  # LOCAL SANDBOX ONLY — OpenBao dev-mode root token from the local OpenBao manifest.
  # This is not production secret management and is used only to resolve sandbox credentials server-side.
  OPENBAO_TOKEN: "openbao-local-root-token"
  # LOCAL SANDBOX ONLY — Shared service token for internal API authentication between worker and API.
  # This token is verified by CurrentIdentityMiddleware for service-to-service calls.
  SUPPORTPLANE_INTERNAL_SERVICE_TOKEN: "e520272b4f1d2c0bd2a8ca519fb6d8b762e18379a7da9c4fc40aba80aa884dcf"
  # LOCAL SANDBOX ONLY — Keycloak OIDC client secret.
  OIDC_CLIENT_SECRET: "supportplane-web-local-secret"
