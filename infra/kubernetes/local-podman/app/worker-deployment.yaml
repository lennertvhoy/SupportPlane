apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportplane-worker
  namespace: supportplane-app
  labels:
    app.kubernetes.io/name: supportplane-worker
    app.kubernetes.io/part-of: supportplane
    supportplane.io/sandbox: local-podman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supportplane-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supportplane-worker
        app.kubernetes.io/part-of: supportplane
        supportplane.io/sandbox: local-podman
    spec:
      containers:
        - name: worker
          image: localhost/supportplane-worker:local-k8s
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SUPPORTPLANE_API_URL
              value: "http://supportplane-api.supportplane-app.svc.cluster.local:4110"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret-local
                  key: DATABASE_URL
            - name: SUPPORTPLANE_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret-local
                  key: SUPPORTPLANE_WORKER_PASSWORD
          # Readiness probe omitted: worker has no HTTP health endpoint yet.
          # The pod is considered ready when the container starts.
