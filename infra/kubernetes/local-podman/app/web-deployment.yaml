apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportplane-web
  namespace: supportplane-app
  labels:
    app.kubernetes.io/name: supportplane-web
    app.kubernetes.io/part-of: supportplane
    supportplane.io/sandbox: local-podman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supportplane-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supportplane-web
        app.kubernetes.io/part-of: supportplane
        supportplane.io/sandbox: local-podman
    spec:
      containers:
        - name: web
          image: localhost/supportplane-web:local-k8s
          imagePullPolicy: Never
          ports:
            - containerPort: 3200
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
