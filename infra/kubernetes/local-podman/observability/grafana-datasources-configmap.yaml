apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: supportplane-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: supportplane
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
