apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: supportplane-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: supportplane
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector:8888
              - otel-collector:8889

      - job_name: supportplane-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - supportplane-api.supportplane-app.svc.cluster.local:4110
