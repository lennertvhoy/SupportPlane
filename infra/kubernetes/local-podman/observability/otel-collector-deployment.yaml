apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: supportplane-observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: supportplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.110.0
          args:
            - --config=/etc/otelcol-contrib/collector.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 8889
              name: prometheus
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: '96Mi'
              cpu: '50m'
            limits:
              memory: '256Mi'
              cpu: '250m'
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/collector.yaml
              subPath: collector.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
