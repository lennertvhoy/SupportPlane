apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: supportplane-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: supportplane
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 32

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: false
      retention_period: 24h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
