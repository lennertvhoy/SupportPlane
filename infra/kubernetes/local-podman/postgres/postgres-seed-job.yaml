apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-seed
  namespace: supportplane-data
  labels:
    app.kubernetes.io/part-of: supportplane
    supportplane.io/sandbox: local-podman
    supportplane.io/job-type: prisma-seed
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: supportplane
        supportplane.io/sandbox: local-podman
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: localhost/supportplane-api:local-k8s
          imagePullPolicy: Never
          command:
            - npx
            - prisma
            - db
            - seed
          env:
            - name: DATABASE_URL
              value: "postgresql://supportplane:supportplane_dev@postgres.supportplane-data.svc.cluster.local:5432/supportplane"
