apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-redis
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: zammad-redis
    app.kubernetes.io/part-of: supportplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-redis
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
