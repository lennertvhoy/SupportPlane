apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zammad-postgres-data
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: zammad-postgres
    app.kubernetes.io/part-of: supportplane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: standard
