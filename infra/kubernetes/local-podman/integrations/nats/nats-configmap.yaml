apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: supportplane
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 64MB
      max_file_store: 256MB
    }
