apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: supportplane
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
  type: ClusterIP
