apiVersion: apps/v1
kind: Deployment
metadata:
  name: asterisk
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: asterisk
    app.kubernetes.io/part-of: supportplane
    supportplane.local/component: asterisk-sandbox
  annotations:
    supportplane.local/note: 'Asterisk-only local sandbox. FreePBX deferred.'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asterisk
        app.kubernetes.io/part-of: supportplane
        supportplane.local/component: asterisk-sandbox
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: asterisk
          # Image choice note:
          # - docker.io/asterisk/asterisk:20 is not publicly pullable (denied).
          # - docker.io/andrius/asterisk:20 timed out during pull in this environment.
          # - docker.io/andrius/asterisk:latest pulled successfully and is
          #   Asterisk 22.8.2 (production-grade, lightweight Alpine-based image).
          #   It is used here as the best available proven option.
          image: docker.io/andrius/asterisk:latest
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args:
            - |
              set -e
              # Copy custom configs so the asterisk user owns them
              # (ConfigMap mounts are root-owned; Asterisk must be able to read.)
              cp /tmp/asterisk-configs/asterisk.conf /etc/asterisk/asterisk.conf
              cp /tmp/asterisk-configs/extensions.conf /etc/asterisk/extensions.conf
              cp /tmp/asterisk-configs/manager.conf /etc/asterisk/manager.conf

              # Inject the real AMI secret from the Kubernetes Secret volume.
              # The secret value is NEVER logged or echoed.
              AMI_SECRET=$(cat /tmp/asterisk-secret/ami-password)
              sed -i "s#local-sandbox-secret-placeholder#${AMI_SECRET}#g" /etc/asterisk/manager.conf

              # Start Asterisk with the upstream image default flags
              exec /usr/sbin/asterisk -vvvdddf -T -W -U asterisk -p
          ports:
            - containerPort: 5038
              name: ami
          livenessProbe:
            exec:
              command:
                - /usr/sbin/asterisk
                - -rx
                - 'core show version'
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 5038
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '256Mi'
              cpu: '250m'
          volumeMounts:
            - name: config
              mountPath: /tmp/asterisk-configs
              readOnly: true
            - name: secret
              mountPath: /tmp/asterisk-secret
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: asterisk-config
            defaultMode: 0644
        - name: secret
          secret:
            secretName: asterisk-ami
            defaultMode: 0440
