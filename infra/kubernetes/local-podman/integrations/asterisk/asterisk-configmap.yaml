apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-config
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: asterisk
    app.kubernetes.io/part-of: supportplane
    supportplane.local/component: asterisk-sandbox
  annotations:
    supportplane.local/note: "Asterisk-only local sandbox. FreePBX deferred."
data:
  asterisk.conf: |
    [directories]
    astetcdir => /etc/asterisk
    astmoddir => /usr/lib/asterisk/modules
    astvarlibdir => /var/lib/asterisk
    astrundir => /var/run/asterisk
    astlogdir => /var/log/asterisk

    [options]
    runuser = asterisk
    rungroup = asterisk
    ; Minimal sandbox — no SIP trunk, no PSTN, no recording

  manager.conf: |
    [general]
    enabled = yes
    webenabled = no
    port = 5038
    bindaddr = 0.0.0.0
    displayconnects = yes

    ; AMI local sandbox user — secret is injected via Kubernetes Secret
    ; and referenced in manager.conf via the deployment env substitution.
    ; For this minimal sandbox we embed the username here; the secret
    ; is mounted separately and NOT exposed in logs or UI.
    [admin]
    secretref = env/AMI_SECRET
    read = all
    write = all
    ; Fallback for containers that do not support secretref:
    ; the deployment injects the actual value via an init script or
    ; environment-aware templating.  Below is a placeholder that is
    ; overwritten at runtime by the startup script when needed.
    secret = local-sandbox-secret-placeholder

  extensions.conf: |
    [general]
    static=yes
    writeprotect=no
    clearglobalvars=no

    ; Minimal dialplan for local sandbox testing.
    ; No SIP trunk, no PSTN, no RTP/audio capture required.
    [default]
    exten => test,1,Answer()
     same => n,Wait(30)
     same => n,Hangup()
