apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: glpi
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: glpi
    app.kubernetes.io/part-of: supportplane
spec:
  serviceName: glpi
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glpi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glpi
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4-noble
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: glpi-db
          env:
            - name: MARIADB_ROOT_HOST
              value: '%'
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'

        - name: glpi
          image: elestio/glpi:latest
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: glpi-config
            - secretRef:
                name: glpi-db
          env:
            - name: GLPI_DB_HOST
              value: '127.0.0.1'
            - name: GLPI_DB_PORT
              value: '3306'
            - name: GLPI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: glpi-db
                  key: MARIADB_DATABASE
            - name: GLPI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: glpi-db
                  key: MARIADB_USER
            - name: GLPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glpi-db
                  key: MARIADB_PASSWORD
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
