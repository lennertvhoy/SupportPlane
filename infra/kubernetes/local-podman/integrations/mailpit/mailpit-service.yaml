apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: supportplane
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
      protocol: TCP
    - name: web
      port: 8025
      targetPort: 8025
      protocol: TCP
  type: ClusterIP
