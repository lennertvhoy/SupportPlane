apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: supportplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: web
          livenessProbe:
            httpGet:
              path: /api/v1/messages
              port: web
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/messages
              port: web
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
