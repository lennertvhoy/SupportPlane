apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: supportplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: openbao
          image: openbao/openbao:2.2.0
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
            - -dev-root-token-id=openbao-local-root-token
          env:
            - name: BAO_ADDR
              value: "http://0.0.0.0:8200"
          ports:
            - containerPort: 8200
              name: http
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /openbao/file
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data
