# Local sandbox only. Not production hardened.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: supportplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: supportplane
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args:
            - start-dev
          envFrom:
            - configMapRef:
                name: keycloak-config
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-dev
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-dev
                  key: admin-password
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-dev
                  key: db-password
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 9000
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
