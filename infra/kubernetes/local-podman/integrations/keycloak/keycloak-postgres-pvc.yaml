# Local sandbox only. Not production hardened.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-data
  namespace: supportplane-integrations
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: supportplane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
  storageClassName: standard
