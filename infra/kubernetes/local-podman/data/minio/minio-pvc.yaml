apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: supportplane-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: supportplane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
