# SupportPlane local development topology
# Verified with: podman-compose (Podman 5.8.2, podman-compose 1.5.0)
# Docker Compose should be compatible with the same file.
#
# Strategy: infra containers verified + host-run apps documented.
# PostgreSQL, NATS, and MinIO run in containers.
# API (NestJS) and Web (Next.js) run on the host via npm dev scripts.
# Worker has no runtime yet; a placeholder container echoes status.

name: supportplane-local

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: sp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportplane
      POSTGRES_PASSWORD: supportplane_dev
      POSTGRES_DB: supportplane
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supportplane -d supportplane']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: docker.io/nats:2-alpine
    container_name: sp-nats
    restart: unless-stopped
    command:
      - '--http_port'
      - '8222'
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: docker.io/minio/minio:latest
    container_name: sp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supportplane
      MINIO_ROOT_PASSWORD: supportplane_dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: docker.io/alpine:latest
    container_name: sp-worker
    restart: 'no'
    command:
      - /bin/sh
      - -c
      - |
        echo "[worker] SupportPlane worker placeholder"
        echo "[worker] No background job runtime exists yet (BL-006)"
        while true; do sleep 3600; done
    # This placeholder exists so 'compose ps' shows a worker slot.
    # It exits immediately on stop; restart: no avoids loops.

volumes:
  postgres_data:
  minio_data:
